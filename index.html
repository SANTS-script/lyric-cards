<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ako ang bagyo</title>
<style>
  html, body { margin:0; height:100%; background:#0b1018; overflow:hidden; font-family:Helvetica,Arial,sans-serif; }
  #start {
    position:fixed; inset:0; margin:auto; width:180px; height:56px;
    font-size:20px; font-weight:bold; color:#172536; background:#88F3FF;
    border:none; border-radius:12px; cursor:pointer; z-index:10;
  }
  #status {
    position:fixed; top:12px; left:0; right:0; text-align:center;
    color:#88F3FF; font-size:16px; z-index:20; padding:0 12px;
  }
  .card {
    position:absolute; left:50%; top:0; width:var(--box-w); height:var(--box-h);
    margin-left:calc(var(--box-w) / -2); box-sizing:border-box; padding:20px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:#172536; color:#88F3FF; font-size:25px; font-weight:bold;
    border-radius:6px; box-shadow:0 0 20px rgba(136,243,255,.25); will-change:transform;
  }
</style>
</head>
<body>

<button id="start">▶ Start</button>
<div id="status"></div>
<audio id="music" src="song.mp3" preload="auto"></audio>

<!--
  EDIT YOUR LYRICS HERE. One line per card, written as:   seconds | text
  Just type normally. Quotes and commas are fine here and cannot break the page.
-->
<script id="lyrics" type="text/plain">
0 | ako,ako
1 | ako ang bagyooooooo
2 | kulimlim ng langit
3 | sa inyong dalawa
3.5 | bulong ko sa hangin
4 | sana di kayo masaya
4.5 | sa tibay ng bahay
5 | na titirhan nyo
5.5 | tatangayin ko bawat yero
6 | dilim ng paligid
6.5 | buhos ng emosyon
7 | kulog ng pag ibig
7.5 | sa sama ng pamahon
8 | sa tibay ng bahay
8.5 | na titirhan nyo
9 | gigibain ko 
9.5 | mga pader nyooooo
10 | dahil ako
10.5 | ako ang bagyoooooooo
</script>

<script>
// ---------------- SETTINGS ----------------
var BOX_W = 350;
var BOX_H = 300;
var RISE_SPEED = 120;        // pixels per second
var BOTTOM_SPAWN_OFFSET = 0;
var GAP = 40;                // minimum gap between cards
// ------------------------------------------

var statusEl = document.getElementById("status");
var startBtn = document.getElementById("start");
var music = document.getElementById("music");

// Show any script error on screen so it is never silent
window.addEventListener("error", function (e) {
  statusEl.textContent = "Error: " + e.message + " (line " + e.lineno + ")";
});

// Read lyrics from the plain-text block
var LYRICS = document.getElementById("lyrics").textContent
  .split("\n")
  .map(function (l) { return l.trim(); })
  .filter(function (l) { return l && l.indexOf("|") > -1; })
  .map(function (l) {
    var i = l.indexOf("|");
    return [parseFloat(l.slice(0, i)), l.slice(i + 1).trim()];
  })
  .filter(function (x) { return !isNaN(x[0]); })
  .sort(function (a, b) { return a[0] - b[0]; });

document.documentElement.style.setProperty("--box-w", Math.min(BOX_W, window.innerWidth - 20) + "px");
document.documentElement.style.setProperty("--box-h", BOX_H + "px");

var cards = [];
var nextIndex = 0;
var lastTime = 0;
var running = false;
var audioOK = true;
var clockStart = 0;   // fallback clock if audio can't play

function spawnY() { return window.innerHeight + BOTTOM_SPAWN_OFFSET; }

function songTime() {
  if (audioOK && !music.paused && music.currentTime > 0) return music.currentTime;
  return (performance.now() - clockStart) / 1000;   // fallback so cards still show
}

function canSpawn() {
  if (!cards.length) return true;
  return cards[cards.length - 1].y + BOX_H + GAP <= spawnY();
}

function spawnCard(text) {
  var el = document.createElement("div");
  el.className = "card";
  el.textContent = text;
  document.body.appendChild(el);
  var card = { el: el, y: spawnY() };
  el.style.transform = "translateY(" + card.y + "px)";
  cards.push(card);
}

function tick(now) {
  if (!running) return;
  var dt = (now - lastTime) / 1000;
  lastTime = now;

  if (nextIndex < LYRICS.length && songTime() >= LYRICS[nextIndex][0] && canSpawn()) {
    spawnCard(LYRICS[nextIndex][1]);
    nextIndex++;
  }

  for (var i = cards.length - 1; i >= 0; i--) {
    var c = cards[i];
    c.y -= RISE_SPEED * dt;
    c.el.style.transform = "translateY(" + c.y + "px)";
    if (c.y + BOX_H < 0) { c.el.remove(); cards.splice(i, 1); }
  }

  if (nextIndex >= LYRICS.length && cards.length === 0) {
    running = false;
    startBtn.textContent = "↻ Replay";
    startBtn.style.display = "block";
    return;
  }
  requestAnimationFrame(tick);
}

startBtn.addEventListener("click", function () {
  cards.forEach(function (c) { c.el.remove(); });
  cards = [];
  nextIndex = 0;
  statusEl.textContent = "";
  startBtn.style.display = "none";

  audioOK = true;
  clockStart = performance.now();
  try { music.currentTime = 0; } catch (e) {}

  // Start the animation right away; do not wait for the audio
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(tick);

  var p;
  try { p = music.play(); } catch (e) { p = Promise.reject(e); }
  if (p && p.then) {
    p.then(function () {
      clockStart = performance.now() - music.currentTime * 1000;
    }).catch(function (err) {
      audioOK = false;
      statusEl.textContent = "Song could not play (" + err.message + "). Showing lyrics without sound.";
    });
  }
});

music.addEventListener("error", function () {
  audioOK = false;
  statusEl.textContent = "song.mp3 was not found. Check it is uploaded to GitHub with exactly that name. Showing lyrics without sound.";
});
</script>
</body>
</html>
